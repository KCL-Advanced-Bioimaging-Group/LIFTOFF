[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "LIFTOFF"
version = "3.2.2"
description = "Portable Leica LIF photon inspection and calibrated export"
requires-python = ">=3.14.10,<3.15"
dependencies = [
    "numpy==2.5.3",
    "Pillow==13.0.0",
    "PySide6==6.11.1",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
    "types-defusedxml==0.7.0.20260504",
    "pylint==4.1.1",
    "pyrefly==1.3.2",
    "ruff==0.16.9",
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "cmake==4.4.3",
    "ninja==1.13.2",
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.8",
]

[project.gui-scripts]
LIFTOFF = "leica_flim_converter.launcher:main"

[tool.setuptools]
packages = ["leica_flim_converter"]
py-modules = ["lif_flim_forensics", "patent_guided_deflate_attack", "leica_xml"]
include-package-data = true

[tool.setuptools.package-data]
leica_flim_converter = ["native/*.dll", "native/*.so", "native/*.dylib", "provenance.json", "kcl_logo.png"]

[tool.ruff]
target-version = "py314"
line-length = 79
indent-width = 4
extend-exclude = [".bootstrap", ".python", ".cache", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pylint.format]
max-line-length = 79

[tool.pylint.main]
py-version = "3.14"
jobs = 1
extension-pkg-allow-list = ["PySide6", "numpy"]

[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = ["build/**", "dist/**"]
python-version = "3.14"
check-unannotated-defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["real_data: Uses optional, externally supplied Leica data"]

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-locals = 25
max-branches = 15
max-statements = 80
max-attributes = 25

[tool.pylint.classes]
defining-attr-methods = [
    "__init__", "__new__", "setUp", "__post_init__", "_build",
    "initialize_workspace", "build_image_navigation",
    "build_channel_controls", "_initialize_image_canvas",
    "initialize_histogram_plot", "_build_toolbar", "_build_summary_panel", "_build_export_selection", "_reset_export_rows", "_start_source_group",
]

[tool.pylint.similarities]
min-similarity-lines = 12
ignore-signatures = true
