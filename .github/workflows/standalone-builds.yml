name: Standalone builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/standalone-builds.yml'
      - 'tools/__init__.py'
      - 'tools/build.py'
      - 'tools/package_standalone.py'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x64
            target: Windows_x86_64
            generator: Visual Studio 17 2022
          - runner: ubuntu-22.04
            architecture: x64
            target: Linux_x86_64
            generator: Ninja
          - runner: macos-15
            architecture: arm64
            target: macOS_arm64
            generator: Ninja
          - runner: macos-15-intel
            architecture: x64
            target: macOS_x86_64
            generator: Ninja
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: pyproject.toml
          architecture: ${{ matrix.architecture }}
      - name: Install Linux Qt and Xvfb dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libegl1 libgl1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Install pinned build dependencies
        run: |
          python -m pip install --only-binary=:all: -e ".[dev]"
          python -m pip check
      - name: Build both native libraries and freeze the application
        env:
          LIFTOFF_GENERATOR: ${{ matrix.generator }}
        run: python -m tools.build --generator "$LIFTOFF_GENERATOR"
      - name: Archive and smoke-test the extracted application
        env:
          LIFTOFF_TARGET: ${{ matrix.target }}
        run: |
          export LIFTOFF_SOURCE_COMMIT="$(git rev-parse HEAD)"
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            QT_QPA_PLATFORM=xcb xvfb-run -a python -m tools.package_standalone "$LIFTOFF_TARGET"
          else
            python -m tools.package_standalone "$LIFTOFF_TARGET"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-${{ matrix.target }}
          path: dist/archives/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  draft-release:
    name: Attach bundles to a draft release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency: standalone-release-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag and source version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$(git rev-parse HEAD)"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v${version}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: standalone-*
          path: assets
          merge-multiple: true
      - name: Verify archives and create draft
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="LIFTOFF_App_${GITHUB_REF_NAME#v}"
          archives=(
            "${bundle}_Windows_x86_64.zip"
            "${bundle}_Linux_x86_64.tar.gz"
            "${bundle}_macOS_arm64.tar.gz"
            "${bundle}_macOS_x86_64.tar.gz"
          )
          for archive in "${archives[@]}"; do
            sha256sum --check "${archive}.sha256"
          done
          sha256sum "${archives[@]}" > SHA256SUMS.txt
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            | jq -r --arg tag "$GITHUB_REF_NAME" '.[] | select(.tag_name == $tag) | .id')
          if [[ -n "$existing" ]]; then
            echo '::error::A draft or published release already exists for this tag.'
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${archives[@]}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
            --title "LIFTOFF $GITHUB_REF_NAME" \
            --notes 'Automated build candidates. Complete release acceptance for these exact archives before publishing. The Windows build is unsigned and the macOS builds are ad-hoc signed and unnotarized.'
