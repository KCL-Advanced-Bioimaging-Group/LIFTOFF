name: Standalone Builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/standalone-builds.yml'
      - 'tools/__init__.py'
      - 'tools/build.py'
      - 'tools/package_standalone.py'
      - 'tools/update_download_links.py'
      - 'pyproject.toml'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x64
            target: Windows_x86_64
            generator: Visual Studio 17 2022
          - runner: ubuntu-22.04
            architecture: x64
            target: Linux_x86_64
            generator: Ninja
          - runner: macos-15
            architecture: arm64
            target: macOS_arm64
            generator: Ninja
          - runner: macos-15-intel
            architecture: x64
            target: macOS_x86_64
            generator: Ninja
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: pyproject.toml
          architecture: ${{ matrix.architecture }}
      - name: Install Linux Qt, Xvfb, and ZIP tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth zip unzip libegl1 libgl1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0
      - name: Install pinned build dependencies
        run: |
          python -m pip install --only-binary=:all: -e ".[dev]"
          python -m pip check
      - name: Build both native libraries and freeze the application
        env:
          LIFTOFF_GENERATOR: ${{ matrix.generator }}
        run: python -m tools.build --generator "$LIFTOFF_GENERATOR"
      - name: Archive and smoke-test the extracted application
        env:
          LIFTOFF_TARGET: ${{ matrix.target }}
        run: |
          export LIFTOFF_SOURCE_COMMIT="$(git rev-parse HEAD)"
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            QT_QPA_PLATFORM=xcb xvfb-run -a python -m tools.package_standalone "$LIFTOFF_TARGET"
          else
            python -m tools.package_standalone "$LIFTOFF_TARGET"
          fi
      - name: Check for an existing ZIP from this run
        id: existing
        if: github.ref == 'refs/heads/main' && github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: LIFTOFF-standalone-${{ matrix.target }}.zip
        run: |
          reuse=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            -f name="$ARCHIVE_NAME" --jq 'any(.artifacts[]; .expired == false)')
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - name: Upload the standalone ZIP
        if: steps.existing.outputs.reuse != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Match the basename for the action's overwrite lookup on tag and PR retries.
          name: LIFTOFF-standalone-${{ matrix.target }}.zip
          path: dist/archives/LIFTOFF-standalone-${{ matrix.target }}.zip
          if-no-files-found: error
          archive: false
          overwrite: ${{ github.ref != 'refs/heads/main' }}
      - name: Upload the release checksum
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LIFTOFF-standalone-${{ matrix.target }}.zip.sha256
          path: dist/archives/LIFTOFF-standalone-${{ matrix.target }}.zip.sha256
          if-no-files-found: error
          archive: false
          overwrite: true

  refresh-downloads:
    name: Refresh standalone download links
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: standalone-download-pages
      queue: max
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate redirects for the successful main build
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo 'Main advanced during this build. A newer run can refresh the links.'
            exit 0
          fi
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            | python3 -m tools.update_download_links build/download-pages
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.prepare.outputs.publish == 'true'
        with:
          path: build/download-pages
          name: github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: steps.prepare.outputs.publish == 'true'
        id: deploy
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  draft-release:
    name: Attach bundles to a draft release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency: standalone-release-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag and source version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$(git rev-parse HEAD)"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v${version}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: LIFTOFF-standalone-*
          path: assets
          merge-multiple: true
          skip-decompress: true
      - name: Verify archives and create draft
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archives=(
            LIFTOFF-standalone-Windows_x86_64.zip
            LIFTOFF-standalone-Linux_x86_64.zip
            LIFTOFF-standalone-macOS_arm64.zip
            LIFTOFF-standalone-macOS_x86_64.zip
          )
          for archive in "${archives[@]}"; do
            sha256sum --check "${archive}.sha256"
          done
          sha256sum "${archives[@]}" > SHA256SUMS.txt
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            | jq -r --arg tag "$GITHUB_REF_NAME" '.[] | select(.tag_name == $tag) | .id')
          if [[ -n "$existing" ]]; then
            echo '::error::A draft or published release already exists for this tag.'
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${archives[@]}" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
            --title "LIFTOFF $GITHUB_REF_NAME" \
            --notes 'Automated build candidates. Complete release acceptance for these exact archives before publishing. The Windows build is unsigned and the macOS builds are ad-hoc signed and unnotarized.'
